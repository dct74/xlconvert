[project]
name = "exconverter"
version = "0.1.0"
description = "Parse Excel (IPO templates, working papers, control sheets) to create hierarchical folders or batch-rename files. Python port of the Swift xlconvert CLI."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openpyxl>=3.1",
]

[project.scripts]
xlconv = "exconverter.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["exconverter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
